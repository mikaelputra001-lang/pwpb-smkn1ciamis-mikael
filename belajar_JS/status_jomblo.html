<body>
    <script>
        let lamaJomblo = prompt("berapa lama anda menjomblo?") ?? "kasihan deh lo";
        if (isNaN(lamaJomblo)) {
            alert("maaf input tidak valid")
        } else {
            if (lamaJomblo <= 2) {
                console.log("masih Fresh")
            } else if (lamaJomblo <= 5) {

                console.log("Mulai Lapuk")
            } else if (lamaJomblo <= 10) {
                console.log("perlu dukun") 
            } else if (lamaJomblo > 10) {
                console.log("Legend")
            } else {
                console.log("Masih Berhubungan?")
            }
        }
    </script>
