<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        .blue{
            color: blue;
        }
    </style>
</head>
<body>
    <form action="show.html" method="post">
        <fieldset>
        <legend>Data Siswa</legend>
            <label>Nis</label>
            <input type=num name="nis" id="nis" max="9"><br>
            <label>Nama</label>
            <input type=text name="nama" id="nama" max="35"><br>
            <label>Kelas</label>
            <select name="kelas" id="kelas">
                <option value="RPL">RPL</option>
                <option value="DKV">DKV</option>
                <option value="AKL">AKL</option>
                <option value="MP">MP</option>
                <option value="KLN">KLN</option>
                <option value="HTL">HTL</option>
                <option value="PM">PM</option>
            </select><br>
            <label>Jenis Kelamin</label>
            <input type="radio" name="jk" id="laki" value="Laki-laki">
            <label for="laki">Laki-laki</label>
            <input type="radio" name="jk" id="perempuan" value="Perempuan">
            <label for="perempuan">Perempuan</label><br>
            <label>Alamat</label>
            <textarea name="alamat" id="alamat" cols="30" rows="10"></textarea><br>
        </fieldset>
    </form>
    <div id="hasil"></div>
    <script>
        console.log("Hello World");
        // alert("MIMI <3 RUSLI");
        document.write('<h1>Selamat Datang</h1><h2>Di Website Saya</h2>');
        let itemSelected = document.getElementById("hasil");
        console.log(itemSelected);
        const blue = document.querySelector("#hasil");
        blue.classList.add("blue");
        itemSelected.innerHTML = "<p>Ini adalah paragraf yang diubah menggunakan JavaScript</p>";
    </script>
</body>
</html>
